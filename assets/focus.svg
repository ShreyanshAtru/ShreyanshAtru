<svg xmlns="http://www.w3.org/2000/svg" width="900" height="84" viewBox="0 0 900 84" role="img" aria-labelledby="focus-title focus-desc">
  <title id="focus-title">AI engineering, Python backends, and API integrations</title>
  <desc id="focus-desc">Three areas of focus on a dark navy panel. A gentle cyan and lilac pulse adds motion while all labels remain readable. Animation is disabled when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101C31"/>
      <stop offset="1" stop-color="#0B1221"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54DCEE" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#B9A1FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#54DCEE" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .label {
        fill: #E9F0FA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 1.4px;
      }
      .halo { opacity: 0.24; animation: breathe 7s ease-in-out infinite; }
      .halo-two { animation-delay: -2.3s; }
      .halo-three { animation-delay: -4.6s; }
      @keyframes breathe {
        0%, 100% { opacity: 0.16; }
        50% { opacity: 0.48; }
      }
      @media (prefers-reduced-motion: reduce) {
        .halo { animation: none; opacity: 0.24; }
      }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="83" rx="18" fill="url(#panel)" stroke="#233149"/>
  <path d="M22 1H878" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g aria-hidden="true">
    <path d="M294 28V56M588 28V56" stroke="#29374D"/>
    <circle class="halo" cx="38" cy="42" r="10" fill="#54DCEE"/>
    <circle cx="38" cy="42" r="3.5" fill="#6CE6F4"/>
    <circle class="halo halo-two" cx="330" cy="42" r="10" fill="#B9A1FF"/>
    <circle cx="330" cy="42" r="3.5" fill="#C5B4FF"/>
    <circle class="halo halo-three" cx="624" cy="42" r="10" fill="#54DCEE"/>
    <circle cx="624" cy="42" r="3.5" fill="#6CE6F4"/>
  </g>

  <text class="label" x="61" y="48">AI ENGINEERING</text>
  <text class="label" x="353" y="48">PYTHON BACKENDS</text>
  <text class="label" x="647" y="48">API INTEGRATIONS</text>
</svg>
